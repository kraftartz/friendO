name: friendo
description: "A private notepad and reminder for friendships."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # The local packages. Path dependencies resolve into this lockfile, so this
  # single `pub get` must satisfy every package's constraints at once. That is
  # where a version clash between the packages would show up.
  friendo_domain:
    path: packages/friendo_domain
  friendo_ui:
    path: packages/friendo_ui

  # Used in code today.
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  cupertino_icons: ^1.0.8

  # Argon2id, for the PIN hash. Pure Dart, so it adds no second native library
  # beside libsqlite3mc.so and it runs the same code in a host test as on the
  # phone. ADR-0006 allowed a PBKDF2 fallback; docs/spec/first-run.md measured
  # this package against the RFC 9106 vector and settled on Argon2id.
  hashlib: ^2.4.2

  # Declared, and not used yet. These are the runtime packages the accepted
  # decision records commit the app to. They are listed early on purpose: a
  # version conflict between them is far cheaper to find now, against an empty
  # app, than later against a half-built feature.
  crypto: ^3.0.7
  diacritic: ^0.1.6
  drift: ^2.34.4
  flutter_local_notifications: ^22.3.0

  # Named here because core/reminders/ imports it directly. ADR-0012 needs the
  # zone database set up before a reminder is scheduled, or a daylight-saving
  # change moves the fire time.
  timezone: ^0.11.1
  flutter_secure_storage: ^11.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Build the bundled SQLite with encryption support.
#
# package:sqlite3 fetches a prebuilt binary through a Dart build hook. This
# switches which one. sqlite3mc is SQLite3MultipleCiphers.
#
# Not sqlcipher: that build links OpenSSL on Android, and its own documentation
# warns it may ship an older SQLite than the other two. sqlite3mc needs no
# extra native library, tracks current SQLite, and still reads a SQLCipher file
# after the compatibility pragmas.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
