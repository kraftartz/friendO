name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter 3.41.7 needs JDK 17 or newer. Pinning it stops a change to the
      # runner image from moving the Java version underneath the build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned, not `channel: stable`. A moving SDK turns an unrelated push into
      # a red build. Raising this pin is a deliberate change, and it moves
      # together with the widgetbook constraint in friendo_ui_book.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          cache: true

      # flutter_secure_storage compiles against Android SDK platform 37, which
      # android/app/build.gradle.kts pins as compileSdk. Install it here rather
      # than leaving it to Gradle's auto-download, which needs accepted
      # licences and fails with a stack trace instead of a clear message.
      #
      # The package id carries the minor version. There is no
      # `platforms;android-37`, and sdkmanager fails on an id it cannot find.
      #
      # The action, rather than a bare `sdkmanager` call: the runner image
      # ships the SDK and the command line tools but leaves their bin directory
      # off PATH, so `sdkmanager` is not a command. The action puts it on PATH
      # and accepts the licences an install needs, which keeps this step
      # working when the image moves its directories.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Fetch dependencies
        run: ./tool/get.sh

      - name: Format and analyse
        run: ./tool/lint.sh

      - name: Test
        run: ./tool/test.sh

      # The only step that proves the native Android side links. The Dart code
      # compiles even when a plugin's Gradle configuration is wrong.
      - name: Build the Android app
        run: flutter build apk --debug

      # The release APK, and only the release APK, carries the two promises the
      # next step reads. The debug and profile manifests declare INTERNET on
      # purpose for hot reload, so checking a debug build would fail on a clean
      # tree. Release signs with the debug key, which is enough to read a
      # manifest and must never reach a store. See ADR-0023.
      - name: Build the release APK
        run: flutter build apk --release

      - name: Check the release manifest
        run: ./tool/manifest_guard.sh
